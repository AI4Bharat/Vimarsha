[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vimarsha-asr"
version = "0.1.0"
description = "Lattice construction and orthographically-informed ASR evaluation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "indic-nlp-library>=0.92",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vimarsha = "vimarsha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
